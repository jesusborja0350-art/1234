<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Barça en vivo</title>
<style>
:root{--bg:#f4f5f9;--card:#fff;--tx:#14182b;--mu:#5b6280;--bd:#dfe2ee;--blue:#004d98;--red:#a50044;--gold:#edbb00}
@media (prefers-color-scheme:dark){:root{--bg:#0c1020;--card:#161b33;--tx:#eef0fa;--mu:#9aa3c7;--bd:#262d52;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#root{max-width:560px;margin:0 auto;padding:14px}
.score{background:linear-gradient(135deg,var(--blue),var(--red));color:#fff;border-radius:18px;padding:18px 14px;text-align:center}
.comp{font-size:13px;opacity:.85;letter-spacing:.04em;text-transform:uppercase}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:10px 0}
.team{flex:1;font-weight:700;font-size:15px}
.big{font-size:44px;font-weight:800;min-width:110px}
.chip{display:inline-block;background:var(--gold);color:#1a1a1a;font-weight:700;border-radius:99px;padding:3px 12px;font-size:13px}
.live{animation:p 1.4s infinite}@keyframes p{50%{opacity:.55}}
h2{font-size:15px;margin:20px 2px 8px;color:var(--mu);text-transform:uppercase;letter-spacing:.05em}
.ev{display:flex;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px 12px;margin-bottom:8px;align-items:center}
.ev.fcb{border-left:5px solid var(--blue)}.ev.rival{border-left:5px solid var(--mu)}
.min{font-weight:800;min-width:42px;color:var(--mu)}.ic{font-size:24px}
.ev b{display:block}.ev small{color:var(--mu)}
.empty{text-align:center;color:var(--mu);padding:24px}
.panel{background:var(--card);border:2px dashed var(--gold);border-radius:14px;padding:12px;margin-top:14px}
.panel h3{margin:0 0 8px;font-size:15px}
.g{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}
input,select,button{font:inherit;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);width:100%}
button{background:var(--blue);color:#fff;border:0;font-weight:600;cursor:pointer}
button.r{background:var(--red)}button.y{background:var(--gold);color:#1a1a1a}button.s{background:var(--mu)}
.f{display:grid;grid-template-columns:1fr 90px;gap:8px}
.lk{background:none;color:var(--mu);font-size:12px;width:auto;margin:18px auto 0;display:block;font-weight:400;text-decoration:underline}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.tabs button{background:var(--mu)}.tabs button.on{background:var(--blue)}
.pitch{background:linear-gradient(#2e7d32,#256628);border-radius:14px;padding:14px 6px;color:#fff}
.pr{display:flex;justify-content:space-around;margin:10px 0}
.pl{text-align:center;font-size:13px;font-weight:600;min-width:60px}
.pl span{display:block;margin:0 auto 2px;width:28px;height:28px;line-height:28px;border-radius:50%;background:#fff;color:#14182b;font-weight:800}
.eye{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);right:10px;background:rgba(0,0,0,.65);color:#fff;border-radius:99px;padding:4px 12px;font-size:14px;font-weight:700;z-index:9}
.eye[hidden]{display:none}
.warn{background:#fff3cd;color:#664d03;padding:12px;border-radius:12px;margin-top:12px}
</style></head>
<body><div id="eye" class="eye" hidden></div><div id="root"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
/* ====== PEGA AQUÍ LOS DATOS DE TU PROYECTO FIREBASE ====== */
const firebaseConfig = {
  apiKey: "AIzaSyBuWT6fOvcXjaCQEXAQsvkThwNVXn3DUek",
  authDomain: "en-vivo-80794.firebaseapp.com",
  databaseURL: "https://en-vivo-80794-default-rtdb.firebaseio.com",
  projectId: "en-vivo-80794",
  storageBucket: "en-vivo-80794.firebasestorage.app",
  messagingSenderId: "692142361124",
  appId: "1:692142361124:web:3d78bc21a9502081baa6b1"
};
/* ========================================================= */

const ST = {pre:'Por comenzar',t1:'1er tiempo',ht:'Descanso',t2:'2do tiempo',ft:'Final'};
const IC = {gol:'⚽',amarilla:'🟨',roja:'🟥',cambio:'🔁',texto:'🎙️'};
const LB = {gol:'¡GOOOL!',amarilla:'Tarjeta amarilla',roja:'Tarjeta roja',cambio:'Cambio',texto:'Comentario'};
let S = {rival:'Real Madrid',comp:'El Clásico',status:'pre',minute:'',events:[]};
const LINE = {
 fcb:[[[17,'Gordon'],[11,'Raphinha'],[10,'Yamal']],[[7,'Fermín'],[16,'Rodri'],[8,'Pedri']],[[2,'Cancelo'],[18,'Martín'],[5,'Cubarsí'],[12,'Espart']],[[1,'Garcia']]],
 rival:[[[25,'Y. Diomande'],[10,'Mbappe']],[[5,'Bellingham'],[20,'Bernardo'],[14,'Tchouaméni'],[15,'Güler']],[[17,'Cucurella'],[4,'Huijsen'],[16,'Konaté'],[8,'Valverde']],[[13,'Lunin']]]
};
let lineTab = 'fcb', viewers = 0;
function updateEye(){const e=$('#eye');e.hidden=!operator;e.textContent='👁️ '+Math.max(0,viewers-1)}
function lineups(){
  const hasR = /madrid/i.test(S.rival);
  if(!hasR) lineTab='fcb';
  const L = LINE[lineTab];
  return `<h2>Alineaciones</h2><div class="tabs"><button class="${lineTab==='fcb'?'on':''}" data-l="fcb">FC Barcelona</button>${hasR?`<button class="${lineTab==='rival'?'on':''}" data-l="rival">${esc(S.rival)}</button>`:''}</div><div class="pitch">${L.map(r=>`<div class="pr">${r.map(q=>`<div class="pl"><span>${q[0]}</span>${esc(q[1])}</div>`).join('')}</div>`).join('')}</div>`;
}
let operator = false, showLogin = false, ref = null, auth = null;
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const configured = !firebaseConfig.apiKey.startsWith('PEGA');

function score(){let a=0,b=0;S.events.forEach(e=>{if(e.t==='gol'){e.team==='fcb'?a++:b++}});return [a,b]}

function render(){
  const focus = document.activeElement && document.activeElement.id;
  const keep = {};
  ['rv','cp','pl','mn','tx','tm','em','pw'].forEach(id=>{const el=document.getElementById(id);if(el)keep[id]=el.value});
  const [a,b]=score(), live = S.status==='t1'||S.status==='t2';
  const evs = S.events.slice().reverse().map(e=>`<div class="ev ${e.team}"><div class="min">${esc(e.min)}'</div><div class="ic">${IC[e.t]}</div><div><b>${LB[e.t]}${e.player?' · '+esc(e.player):''}</b><small>${e.t==='texto'?esc(e.text||''):(e.team==='fcb'?'FC Barcelona':esc(S.rival))}</small></div></div>`).join('');
  $('#root').innerHTML = `
  ${configured?'':'<div class="warn">Falta pegar los datos de Firebase en el archivo (sección firebaseConfig).</div>'}
  <div class="score"><div class="comp">${esc(S.comp)}</div>
    <div class="row"><div class="team">FC Barcelona</div><div class="big">${a} - ${b}</div><div class="team">${esc(S.rival)}</div></div>
    <span class="chip ${live?'live':''}">${live?'● EN VIVO · ':''}${ST[S.status]||''}${live&&S.minute?' · '+esc(S.minute)+"'":''}</span></div>
  <h2>Minuto a minuto</h2>${evs||'<div class="empty">Aún no hay jugadas. ¡Se actualiza solo!</div>'}
  ${lineups()}
  <div id="op"></div>`;
  document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{lineTab=b.dataset.l;render()});
  if(operator) panel(); else if(showLogin) loginBox(); else $('#op').innerHTML='<button class="lk" id="lg">Panel del transmisor</button>';
  const lg=$('#lg'); if(lg) lg.onclick=()=>{showLogin=true;render()};
  Object.keys(keep).forEach(id=>{const el=document.getElementById(id);if(el)el.value=keep[id]});
  if(focus){const el=document.getElementById(focus);if(el&&el.focus)el.focus()}
}

function loginBox(){
  $('#op').innerHTML = `<div class="panel"><h3>🔐 Entrar como transmisor</h3>
  <input id="em" type="email" placeholder="Correo" autocomplete="username">
  <input id="pw" type="password" placeholder="Clave" autocomplete="current-password" style="margin-top:8px">
  <button id="go" style="margin-top:8px">Entrar</button></div>`;
  $('#go').onclick=()=>{
    if(!auth)return;
    auth.signInWithEmailAndPassword($('#em').value.trim(),$('#pw').value).catch(()=>alert('Correo o clave incorrectos'));
  };
}

function panel(){
  $('#op').innerHTML = `<div class="panel"><h3>🎛️ Panel del transmisor (solo tú lo ves)</h3>
  <div class="f"><input id="rv" placeholder="Equipo rival" value="${esc(S.rival)}"><input id="cp" placeholder="Torneo" value="${esc(S.comp)}"></div>
  <div class="f" style="margin-top:8px"><input id="pl" placeholder="Jugador (opcional)" list="pls"><input id="mn" type="number" min="0" max="130" placeholder="Min" value="${esc(S.minute||'')}"></div>
  <datalist id="pls">${[...new Set([...LINE.fcb,...LINE.rival].flat(2).filter(x=>typeof x==='string').concat(S.events.map(e=>e.player).filter(Boolean)))].map(p=>`<option value="${esc(p)}">`).join('')}</datalist>
  <select id="tm" style="margin-top:8px"><option value="fcb">Equipo: FC Barcelona</option><option value="rival">Equipo: Rival</option></select>
  <div class="g"><button data-t="gol">⚽ Gol</button><button class="y" data-t="amarilla">🟨 Amarilla</button><button class="r" data-t="roja">🟥 Roja</button><button class="s" data-t="cambio">🔁 Cambio</button></div>
  <input id="tx" placeholder="Comentario libre (ej: gran atajada)" style="margin-top:8px"><button data-t="texto" class="s" style="margin-top:8px">🎙️ Publicar comentario</button>
  <div class="g"><button class="s" data-s="t1">Inicio 1T</button><button class="s" data-s="ht">Descanso</button><button class="s" data-s="t2">Inicio 2T</button><button class="s" data-s="ft">Final</button></div>
  <div class="g"><button class="r" id="un">↩︎ Deshacer último</button><button class="s" id="so">Salir</button></div></div>`;
  document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>addEv(b.dataset.t));
  document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{sync();S.status=b.dataset.s;save()});
  $('#un').onclick=()=>{S.events.pop();save()};
  $('#so').onclick=()=>auth.signOut();
}
function sync(){S.rival=$('#rv').value.trim()||'Rival';S.comp=$('#cp').value.trim()||'LaLiga';S.minute=$('#mn').value}
function addEv(t){
  sync();
  const e={t,team:$('#tm').value,min:$('#mn').value||'0',player:$('#pl').value.trim(),text:$('#tx').value.trim()};
  if(t==='texto'&&!e.text)return;
  S.events.push(e);
  $('#pl').value='';$('#tx').value='';
  save();
}
function save(){
  if(!ref)return;
  ref.set(S).catch(()=>alert('No se pudo guardar. ¿Iniciaste sesión?'));
}

render();
if(configured){
  firebase.initializeApp(firebaseConfig);
  auth = firebase.auth();
  ref = firebase.database().ref('partido');
  ref.on('value', snap => {
    const v = snap.val();
    if(v){S = {rival:v.rival||'Rival',comp:v.comp||'LaLiga',status:v.status||'pre',minute:v.minute||'',events:v.events||[]}}
    render();
  });
  const db = firebase.database(), pres = db.ref('presencia'), me = pres.push();
  db.ref('.info/connected').on('value', s => { if(s.val()){ me.onDisconnect().remove().then(()=>me.set(true)) } });
  pres.on('value', s => { viewers = s.numChildren(); updateEye() });
  auth.onAuthStateChanged(u => {operator=!!u; if(u)showLogin=false; render(); updateEye()});
}
</script></body></html>
